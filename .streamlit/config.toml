# Clario theme: a navy workspace with a purple accent, and a matching light version.
# Each user picks Light, Dark or their system setting from the menu (top right, ⋮ › Settings).

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseFontSize = 16
headingFontSizes = ["2.1rem", "1.45rem", "1.15rem", "1rem", "0.9rem", "0.8rem"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true            # a thin line between the sidebar and the page
linkUnderline = false

[theme.dark]
primaryColor = "#6D5DE7"            # purple: buttons and active elements (white text stays readable)
backgroundColor = "#223559"         # navy page, the same as the sidebar
secondaryBackgroundColor = "#2E436A"  # slate navy cards, inputs and table cells (dark enough for readable captions)
textColor = "#F8FAFC"               # near-white
borderColor = "#4A5E85"
linkColor = "#C9C2FF"
codeTextColor = "#C9C2FF"           # review IDs and other code-style text
codeBackgroundColor = "#2B4068"
dataframeBorderColor = "#4A5E85"
dataframeHeaderBackgroundColor = "#2B4068"

# Status badge colours: lighter tints, readable on navy
greenColor = "#5FD39A"
orangeColor = "#F5C46B"
redColor = "#FF9B8A"
blueColor = "#8FB8FF"
violetColor = "#C9C2FF"
grayColor = "#9097AE"

[theme.dark.sidebar]
backgroundColor = "#223559"         # navy
secondaryBackgroundColor = "#2E436A"  # the selected menu item
textColor = "#F8FAFC"
borderColor = "#4A5E85"
primaryColor = "#C9C2FF"            # light purple, readable on navy

[theme.light]
primaryColor = "#5B4BD6"            # deeper purple, so white button text stays readable
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F2FA"  # cards, inputs and table cells
textColor = "#1A1B25"
borderColor = "#DCDCE8"
linkColor = "#4F3FD0"
codeTextColor = "#4F3FD0"           # review IDs and other code-style text
codeBackgroundColor = "#ECEBF7"
dataframeBorderColor = "#DCDCE8"
dataframeHeaderBackgroundColor = "#ECEBF7"

# Status badge colours: darker shades, readable on white
greenColor = "#1A7F4B"
orangeColor = "#A15C00"
redColor = "#C2362B"
blueColor = "#1F5FBF"
violetColor = "#5B4BD6"
grayColor = "#5F6478"

[theme.light.sidebar]
backgroundColor = "#F6F5FC"
secondaryBackgroundColor = "#E7E4FA"  # the selected menu item
textColor = "#2A2C3A"
borderColor = "#DCDCE8"
primaryColor = "#5B4BD6"

[client]
toolbarMode = "viewer"             # shows the theme switch; hides the developer menu and Deploy button
